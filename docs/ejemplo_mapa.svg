<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360">
  <rect width="600" height="360" fill="#f5f5f5" />
  <text x="300" y="70" font-family="Arial, sans-serif" font-size="32" fill="#2c3e50" text-anchor="middle" font-weight="bold">
    Mapa interactivo (ejemplo)
  </text>
  <rect x="60" y="110" width="480" height="180" fill="#ffffff" stroke="#d0d0d0" stroke-width="3" rx="12" />
  <circle cx="150" cy="180" r="12" fill="#1f77b4" />
  <circle cx="240" cy="210" r="12" fill="#ff7f0e" />
  <circle cx="360" cy="170" r="12" fill="#2ca02c" />
  <polyline points="150,180 240,210 360,170 430,230" fill="none" stroke="#2ca02c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" />
  <polyline points="60,250 520,250" fill="none" stroke="#34495e" stroke-width="2" stroke-dasharray="4 6" />
  <text x="90" y="290" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">
    • Capas por operador (Claro / Movistar / Entel)
  </text>
  <text x="90" y="315" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">
    • Colores de recorrido por red (2G / 3G / 4G) y calidad de señal en cada punto
  </text>
  <text x="90" y="340" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">
    • Filtro por día disponible desde la línea de comandos
  </text>
</svg>
