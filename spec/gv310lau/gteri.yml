name: "+RESP:GTERI"
device: "GV310LAU"
message_family: "ERI (Expand Fixed Report Information)"
encoding: "ASCII"
delimiter: ","
terminator: "$"

# --- Configuración/Features para compatibilidad ---
config:
  # Modo de interpretación del bit 3 de position_append_mask: "pdop" o "accuracy_factor"
  # Desde v9.00 se documenta "GNSS accuracy factor" como opción.
  posmask_bit3_mode: "pdop"
  # Algunos firmwares envían HDOP/VDOP/PDOP aun con los bits apagados.
  tolerate_unmasked_position_fields:
    - hdop
    - vdop
    - pdop

version_field:
  name: full_protocol_version
  length: 6
  format: hex
  example: "6E1203"

schema:
  sections:
    - name: head
      fields:
        - { name: header, const_any: ["+RESP:GTERI", "+BUFF:GTERI"], type: string }
        - { name: full_protocol_version, type: hex, length: 6, example: "6E1203" }
        - { name: imei, type: string, length: 15, pattern: "^[0-9]{15}$", example: "864696060004173" }
        - { name: device_name, type: string, max_length: 20, pattern: "^[0-9A-Za-z_-]{1,20}$", example: "GV310LAU" }

    - name: body
      fields:
        # --- Máscaras y cabecera de cuerpo ---
        - { name: eri_mask, type: hex, length: 8, example: "00000100" }
        - { name: external_power_mv, type: int, min: 0, max: 32000, nullable: true }
        - { name: report_type, type: string, length: 2, note: "X(1-5)Y(0-6)" }
        - { name: number, type: int, min: 1, max: 15 }

        # --- Posición ---
        - { name: gnss_accuracy_level, type: int, min: 0, max: 50 }
        - { name: speed_kmh, type: float, min: 0.0, max: 999.9 }
        - { name: azimuth_deg, type: int, min: 0, max: 359 }
        - { name: altitude_m, type: float, note: "(-)xxxxx.x" }
        - { name: longitude_deg, type: float, note: "(-)xxx.xxxxxx" }
        - { name: latitude_deg, type: float, note: "(-)xx.xxxxxx" }
        - { name: gnss_utc_time, type: datetime, format: "YYYYMMDDHHMMSS" }

        # GSM
        - { name: mcc, type: string, pattern: "^0[0-9]{3}$" }
        - { name: mnc, type: string, pattern: "^0[0-9]{2,3}$" }
        - { name: lac, type: hex, length: 4 }
        - { name: cell_id, type: hex, length_variant: [4,8] }

        # Position Append Mask
        - { name: position_append_mask, type: hex, length: 2, example: "03" }
        - { name: sats_in_use, type: int, min: 0, max: 72, when: { mask: position_append_mask, bit: 0 } }
        - { name: hdop, type: float, min: 0.00, max: 99.99, when: { mask: position_append_mask, bit: 1 }, semantics: "0 => GNSS fix fail; >0 => HDOP real" }
        - { name: vdop, type: float, min: 0.00, max: 99.99, when: { mask: position_append_mask, bit: 2 }, semantics: "0 => GNSS fix fail; >0 => VDOP real" }
        # Bit 3 conmutable según firmware
        - name: pdop
          type: float
          min: 0.00
          max: 99.99
          when:
            allOf:
              - { mask: position_append_mask, bit: 3 }
              - { feature: "posmask_bit3_mode", equals: "pdop" }
          semantics: "0 => GNSS fix fail; >0 => PDOP real"
        - name: gnss_accuracy_factor
          type: int
          min: 0
          max: 255
          when:
            allOf:
              - { mask: position_append_mask, bit: 3 }
              - { feature: "posmask_bit3_mode", equals: "accuracy_factor" }
          note: "Factor de precisión GNSS (según firmware)"

        # --- Odómetro y horas ---
        - { name: mileage_km, type: float, min: 0.0, max: 4294967.0 }
        - { name: hour_meter, type: string, length: 13, pattern: "^[0-9]{7}:[0-9]{2}:[0-9]{2}$", note: "formato 0000000:00:00" }

        # --- Entradas analógicas ---
        - { name: analog_in_1, type: analog_value }
        - { name: analog_in_2, type: analog_value }
        - { name: analog_in_3, type: analog_value }

        # --- Estado de equipo ---
        - { name: backup_battery_pct, type: int, min: 0, max: 100 }
        - { name: device_status, type: hex, length_variant: [6,10] }
        - { name: uart_device_type, type: int, enum: [0,1,2,5,6,7] }

        # --- Bloques ERI (presencia controlada por eri_mask) ---
        # Bit 0: Digital Fuel Sensor Data
        - name: digital_fuel_sensor_data
          type: hex
          max_length: 20
          when: { mask: eri_mask, bit: 0 }

        # Bit 1: 1-Wire Data
        - name: one_wire_device_number
          type: int
          min: 0
          max: 19
          optional: true
          default_if_absent: 0
          present_if: { mask_field: eri_mask, bit: 1 }

        - name: one_wire_devices
          type: group_repeated
          repeat: one_wire_device_number
          optional: true
          enabled_if_any:
            - { mask_field: eri_mask, bit: 1 }
          fields:
            - { name: one_wire_device_id,   type: hex,   length_variant: [16] }
            - { name: one_wire_device_type, type: int,   enum: [1], optional: true, note: "1 => sensor de temperatura (DS18B20)" }
            - { name: one_wire_device_data, type: hex,   max_length: 40, optional: true, note: "Two's complement 16-bit" }

        # Bit 2: CAN Data (ASCII)
        - name: can_data
          type: hex
          max_length: 1000
          when: { mask: eri_mask, bit: 2 }

        # Bits 3/4: Fuel Sensor Data (se muestra si cualquiera de los dos está activo)
        - name: fuel_sensor_block
          type: object
          when:
            anyOf:
              - { mask: eri_mask, bit: 3 }
              - { mask: eri_mask, bit: 4 }
          properties:
            sensor_number: { type: int, min: 0, max: 100 }
            sensors:
              type: array
              items:
                type: object
                properties:
                  type: { type: int, enum: [0,1,2,3,4,6,8,20,21,22] }
                  percentage:
                    type: float
                    min: 0.0
                    max: 100.0
                    nullable: true
                    when: { mask: eri_mask, bit: 3 }
                  volume_l:
                    type: float
                    min: 0.0
                    max: 6000.0
                    nullable: true
                    when: { mask: eri_mask, bit: 4 }
                  fuel_temperature_c:
                    type: int
                    min: -40
                    max: 85
                    nullable: true
                    when:
                      allOf:
                        - { mask: eri_mask, bit: 10 }
                        - { anyOf: [ { field: type, equals: 2 }, { field: type, equals: 6 } ] }

        # Bit 7: RF433 Accessory Data
        - name: rf433_block
          type: object
          when: { mask: eri_mask, bit: 7 }
          properties:
            accessory_number: { type: int, min: 0, max: 10 }
            accessories:
              type: array
              items:
                type: object
                properties:
                  serial: { type: hex, length: 5 }
                  type: { type: int, enum: [1,2], note: "1=WTS100, 2=WTH100" }
                  temperature_c: { type: int, min: -20, max: 60 }
                  humidity_pct:
                    type: int
                    min: 0
                    max: 100
                    nullable: true
                    when: { field: type, equals: 2 }

        # Bit 8: Bluetooth Accessory Data
        - name: ble_block
          type: object
          when: { mask: eri_mask, bit: 8 }
          properties:
            accessory_number: { type: int, min: 0, max: 25 }
            items:
              type: array
              items:
                type: object
                properties:
                  index: { type: string, pattern: "^(0[0-9]|1[0-9]|2[0-5]|0xFE)$" }
                  accessory_type: { type: int, enum: [0,1,2,3,6,7,8,10,11,12,13] }
                  model_or_beacon_id_model: { type: int, min: 0, max: 5 }

                  raw_data:
                    type: hex
                    max_length: 36  # <=18 bytes en ASCII HEX
                    nullable: true
                  append_mask: { type: hex, length: 4,  nullable: true }

                  # Campos sujetos a append_mask
                  name:
                    type: string
                    max_length: 20
                    nullable: true
                    when: { mask: append_mask, bit: 0 }

                  mac:
                    type: hex
                    length: 12
                    nullable: true
                    when: { mask: append_mask, bit: 1 }

                  status:
                    type: int
                    enum: [0,1]
                    nullable: true
                    when: { mask: append_mask, bit: 2 }

                  battery_mv:
                    type: int
                    min: 0
                    max: 5000
                    nullable: true
                    when: { mask: append_mask, bit: 3 }

                  temp_c:
                    type: float
                    min: -40.0
                    max: 80.0
                    nullable: true
                    when: { mask: append_mask, bit: 4 }

                  humidity_pct:
                    type: int
                    min: 0
                    max: 100
                    nullable: true
                    when: { mask: append_mask, bit: 5 }

                  # Bit 7: datos IO del accesorio
                  output_status:
                    type: hex
                    length: 2
                    nullable: true
                    when: { mask: append_mask, bit: 7 }

                  digital_input_status:
                    type: hex
                    length: 2
                    nullable: true
                    when: { mask: append_mask, bit: 7 }

                  analog_input_mv:
                    type: int
                    min: 0
                    max: 32000
                    nullable: true
                    when: { mask: append_mask, bit: 7 }

                  # Bit 8: modo/evento
                  accessory_mode:
                    type: int
                    min: 0
                    max: 3
                    nullable: true
                    when: { mask: append_mask, bit: 8 }
                  event:
                    type: int
                    enum: [0,1,2]
                    nullable: true
                    when: { mask: append_mask, bit: 8 }

                  tire_pressure_kpa:
                    type: int
                    min: 0
                    max: 500
                    nullable: true
                    when: { mask: append_mask, bit: 9 }

                  timestamp:
                    type: datetime
                    format: "YYYYMMDDHHMMSS"
                    nullable: true
                    when: { mask: append_mask, bit: 10 }

                  enhanced_temp_c:
                    type: float
                    min: -40.00
                    max: 80.00
                    nullable: true
                    when: { mask: append_mask, bit: 11 }

                  magnet_id:
                    type: hex
                    length: 2
                    nullable: true
                    when: { mask: append_mask, bit: 12 }

                  mag_event_counter:
                    type: int
                    min: 0
                    max: 32767
                    nullable: true
                    when: { mask: append_mask, bit: 12 }

                  magnet_state:
                    type: int
                    enum: [0,1]
                    nullable: true
                    when: { mask: append_mask, bit: 12 }

                  battery_pct:
                    type: int
                    min: 0
                    max: 100
                    nullable: true
                    when: { mask: append_mask, bit: 13 }

                  relay_state:
                    type: int
                    enum: [0,1]
                    nullable: true
                    when: { mask: append_mask, bit: 14 }

    - name: tail
      fields:
        - { name: send_time, type: datetime, format: "YYYYMMDDHHMMSS" }
        - { name: count_hex, type: hex, length: 4 }

# --- Tipos auxiliares ---
aux_types:
  analog_value:
    oneOf:
      - { type: int, min: 0, max: 16000, unit: mV }
      - { type: string, pattern: "^F(100|[0-9]{1,2})$", note: "F0..F100 => porcentaje" }

# --- Máscaras ---
masks:
  position_append_mask:
    bits:
      0: { field: sats_in_use }
      1: { field: hdop }
      2: { field: vdop }
      3:
        oneOf:
          - { field: pdop, when_feature: "posmask_bit3_mode=pdop" }
          - { field: gnss_accuracy_factor, when_feature: "posmask_bit3_mode=accuracy_factor" }

  eri_mask:
    bits:
      0:  { block: digital_fuel_sensor_data }
      1:
        fields:
          - one_wire_device_number
          - one_wire_devices
      2:  { block: can_data }
      3:  { note: "Enable Fuel Sensor Data: Percentage", block: fuel_sensor_block }
      4:  { note: "Enable Fuel Sensor Data: Volume", block: fuel_sensor_block }
      7:  { block: rf433_block }
      8:  { block: ble_block }
      10: { note: "Fuel Temperature (only type 2 or 6)", block: fuel_sensor_block }

ble_append_mask:
  bits:
    0:  { name: accessory_name,               field: name }
    1:  { name: accessory_mac,                field: mac }
    2:  { name: accessory_status,             field: status }
    3:  { name: accessory_battery_voltage,    field: battery_mv }
    4:  { name: accessory_temperature,        field: temp_c }
    5:  { name: accessory_humidity,           field: humidity_pct }
    6:  { name: reserved }
    7:  { name: accessory_io,                 fields: [output_status, digital_input_status, analog_input_mv] }
    8:  { name: accessory_event,              fields: [accessory_mode, event] }
    9:  { name: tire_pressure,                field: tire_pressure_kpa }
    10: { name: timestamp,                    field: timestamp }
    11: { name: enhanced_temperature,         field: enhanced_temp_c }
    12: { name: magnet_data,                  fields: [magnet_id, mag_event_counter, magnet_state] }
    13: { name: accessory_battery_percentage, field: battery_pct }
    14: { name: relay_data,                   field: relay_state }
    15: { name: valid_bits_0_14_when_0 }

# --- Validación y reglas ---
validation:
  rules:
    - name: header_and_message
      assert: "header == '+RESP:GT' and message == 'ERI'"
    - name: terminator
      assert: "line.endswith('$')"
    - name: gnss_fix_semantics
      note: "Si hdop/vdop/pdop == 0 => gnss_fix=false y se usa última posición conocida."
    - name: position_append_cardinality
      note: "El número de campos posicionales presentes debe coincidir con los bits activos en position_append_mask."
    - name: timezone_normalization
      note: "Convertir gnss_utc_time, send_time y timestamps BLE automáticamente a Chile continental (DST según fecha) y conservar UTC crudo."

# --- Ejemplo del manual ---
examples:
  - raw: "+RESP:GTERI,6E1203,864696060004173,GV310LAU,00000100,,10,1,1,0.0,0,115.8,117.129356,31.839248,20230808061540,0460,0001,DF5C,05FE6667,03,15,,4.0,0000102:34:33,14549,42,11172,100,210000,0,1,0,06,12,0,001A42A2,0617,TMPS,08351B00043C,1,26,65,20231030085704,20231030085704,0017$"
    parsed_keys_must_include:
      - header
      - imei
      - eri_mask
      - longitude_deg
      - latitude_deg
      - position_append_mask
      - sats_in_use
      - hdop
      - mileage_km
      - hour_meter
      - send_time
      - count_hex

notes:
  - "Mantener valores crudos además de normalizados cuando haya conversiones (1-Wire, BLE raw)."
  - "Iterar RF433/BLE según 'accessory_number' y aplicar ble_append_mask por ítem."
  - "Hour meter: validar longitud exacta 13 (HHHHHHH:MM:SS)."
  - "Bits ERI por especificación: 0=Digi. Fuel, 1=1-Wire, 2=CAN, 3=Percentage, 4=Volume, 7=RF433, 8=BLE, 10=Fuel Temp."
