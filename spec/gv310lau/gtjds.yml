  - raw: "+RESP:GTJDS,6E0C03,868589060255190,GV310LAU,1,3,0,126.8,339,759.7,-70.625297,-33.348113,20251016202239,0730,0002,0517,00103625,00,20251016202301,837A$"
  - raw: "+BUFF:GTJDS,6E0405,868589060248765,GV310LAU,2,3,0,29.1,64,472.4,-72.157288,-38.322191,20251016201851,,,,,00,20251016201851,80DE$"
