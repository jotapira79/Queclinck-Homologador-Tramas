name: "+RESP/+BUFF:GTFRI"
device: "GV75LAU"
message_family: "FRI"
encoding: "ASCII"
delimiter: ","
terminator: "$"
version_field: { name: full_protocol_version, length: 10, format: hex }

# Fuente técnica principal: @Track Air Interface Protocol GV75LAU v3.00
# Orden de parámetros GTFRI: (Full Protocol Version, IMEI, Device Name?, Report ID/Type, Number, GNSS block, GSM tower,
# Position Append Mask, [Satellites]*, Mileage*, Send Time, Count)
# *Condicionales: [Satellites] si PAM bit0=1; Mileage si Report Composition Mask bit4=1. GNSS Trigger Type aparece si PAM bit1=1 (solo FRI/ERI).

schema:
  sections:
    - name: head
      fields:
        - { name: header, const_any: ["+RESP:GT", "+BUFF:GT"], type: string }
        - { name: message, const: "FRI", type: string }
        - { name: full_protocol_version, type: hex, length: 10 }
        - { name: imei, type: string, length: 15, pattern: "^[0-9]{15}$" }
        # Device Name puede omitirse si <Report Composition Mask> bit 6 = 0
        - { name: device_name, const: "GV75LAU", type: string, optional: true }

    - name: body
      fields:
        # Puede venir antes del report_id_type si AT+GTEPS 'Sync with FRI'=1
        - name: ext_power_mv
          type: int
          min: 1000
          max: 900000
          optional: true
          comment: "External Power Voltage (mV); algunos firmware lo envían antes de <report_id_type>"

        # Report ID / Report Type: 1 byte en HEX (XY: X=ID, Y=Type)
        - { name: report_id_type, type: hex, length: 2, comment: "XY -> X=Report ID (1..5), Y=Report Type (0..6)" }

        # En v3.00 el máximo documentado sube hasta 15 (generalmente es 1 en ASCII)
        - { name: number, type: int, min: 1, max: 15, comment: "Cantidad de posiciones GNSS en el reporte" }

        # --- GNSS Position (repite por 'number' veces en GTFRI; este esquema describe 1 posición) ---
        - { name: gnss_accuracy_hdop, type: int, min: 0, max: 50, comment: "0 = no fix, 1..50 = HDOP" }
        - { name: speed_kmh, type: float, min: 0.0, max: 999.9, precision: 1 }
        - { name: azimuth_deg, type: int, min: 0, max: 359 }
        - { name: altitude_m, type: float, min: -3000.0, max: 60000.0, precision: 1 }
        - { name: longitude, type: float, min: -180.0, max: 180.0, precision: 6 }
        - { name: latitude, type: float, min: -90.0, max: 90.0, precision: 6 }
        - { name: gnss_utc_time, type: datetime, format: "YYYYMMDDHHMMSS" }

        # GSM tower data (si <Report Composition Mask> bit 3 = 1; de lo contrario pueden venir vacíos)
        - { name: mcc, type: string, length: 4, pattern: "^0[0-9]{3}$", optional: true }
        - { name: mnc, type: string, length: 4, pattern: "^0[0-9]{3}$", optional: true }
        - { name: lac, type: hex, length: 4, optional: true }
        - { name: cell_id, type: hex, length_variant: [4,8], optional: true }

        # Máscara de anexos por posición (después de Cell ID)
        - { name: position_append_mask, type: hex, max_length: 2, comment: "Bit0: Satellites; Bit1: GNSS Trigger Type (solo FRI/ERI, auto); Bit2: Device Status (eventos)" }

        # PAM bit0 => número de satélites (0..72 en v3.00)
        - { name: satellites_used, type: int, min: 0, max: 72, optional: true, present_if: "position_append_mask & 0x01" }

        # PAM bit1 => GNSS Trigger Type (solo FRI/ERI). El equipo lo muestra si Wrap Corner Point=1
        - { name: gnss_trigger_type, type: int, enum: [0,1,2,3,4], optional: true, present_if: "position_append_mask & 0x02", comment: "0:Time,1:Corner,2:Distance,3:Mileage,4:Optimum" }

        # Kilometraje total (si <Report Composition Mask> bit 4 = 1)
        - { name: mileage_km, type: float, min: 0.0, max: 4294967.0, precision: 1, optional: true }

        # Hour Meter (si AT+GTHMC habilitado)
        - { name: hour_meter_count, type: string, pattern: "^[0-9]{5,7}:[0-9]{2}:[0-9]{2}$", optional: true }

        #Reservados
        - { name: reserved1, type: string, optional: true }
        - { name: reserved2, type: string, optional: true }
        - { name: reserved3, type: string, optional: true }

        #Porcentaje de batería y estado dispositvo
        - { name: backup_battery_percentage, type: int, min: 0, max: 100, optional: true }
        - { name: device_status, type: hex, length_variant: [6,10] }
        
        #Reservados
        - { name: reserved4, type: string, optional: true }
        - { name: reserved5, type: string, optional: true }
        - { name: reserved6, type: string, optional: true }
        

    - name: tail
      fields:
        # Hora de envío generada por el equipo (UTC).
        - { name: send_time, type: datetime, format: "YYYYMMDDHHMMSS" }
        - { name: count_hex, type: hex, length: 4 }

validation:
  rules:
    - { name: header_and_message, assert: "(header in ['+RESP:GT', '+BUFF:GT']) and message == 'FRI'" }
    - { name: terminator, assert: "line.endswith('$')" }
    - { name: report_id_range, assert: "int(report_id_type[0],16) in [1,2,3,4,5]" }
    - { name: report_type_range, assert: "int(report_id_type[1],16) in [0,1,2,3,6]" }

notes:
  - "Position Append Mask: bit0=satélites (in use/in view) para la posición; bit1=GNSS Trigger Type (solo FRI/ERI, no configurable por AT+GTCFG); bit2=Device Status (aplica a casi todos los mensajes de evento, no GTFRI)."
  - "Si Wrap Corner Point=1 (AT+GTFRI), el equipo fuerza PAM bit1=1 en FRI/ERI y agrega <gnss_trigger_type>."
  - "<satellites_used> ahora tiene rango 0–72."
  - "'<number>' puede ser >1 si se empaquetan puntos (máx. 15)."
  - "<mileage_km> aparece sólo si <Report Composition Mask> bit4=1 (AT+GTCFG)."
  - "<ext_power_mv> aparece si AT+GTEPS está configurado con 'Sync with FRI'=1."
  - "<device_name> puede omitirse si <Report Composition Mask> bit6=0; si viene, debe ser 'GV75LAU'."

examples:
  # Ejemplo ficticio acorde a v3.00; con PAM bit0+bit1 y gnss_trigger_type presente.
  - raw: "+RESP:GTFRI,80200C0300,866314060583471,GV75LAU,10,1,12,45.6,180,12.3,-70.650123,-33.437200,20251029091530,0460,0000,1A2B,0003,08,12345.6,20251029091533,1A2B$"
    parsed_keys_must_include: [imei, report_id_type, number, gnss_utc_time, position_append_mask, satellites_used, gnss_trigger_type, send_time, count_hex]
  # Ejemplo con solo satélites (PAM bit0) y sin trigger type
  - raw: "+BUFF:GTFRI,80200C0300,866314060583471,GV75LAU,11,1,8,0.0,0,0.0,-70.650100,-33.437100,20251029092000,0460,0000,1A2B,0001,09,0,00012:35:07,20251029092002,3F7C$"
    parsed_keys_must_include: [header, message, report_id_type, satellites_used, hour_meter_count, send_time]
