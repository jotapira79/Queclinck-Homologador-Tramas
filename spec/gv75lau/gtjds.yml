name: "+RESP/+BUFF:GTJDS"
device: "GV75LAU"
message_family: "JDS (Network Jamming Indication Notification)"
encoding: "ASCII"
delimiter: ","
terminator: "$"

config:
  append_mask:
    field: position_append_mask
    length: 2
    default: "00"
    bits:
      0: { name: satellites_in_use,            desc: "0-72" }
      1: { name: horizontal_gnss_accuracy,     desc: "0.00-99.99" }
      2: { name: vertical_gnss_accuracy,       desc: "0.00-99.99" }
      3: { name: gnss_3d_accuracy,             desc: "0.00-99.99" }

schema:
  sections:
    - name: head
      fields:
        - { name: header, const_any: ["+RESP:GTJDS", "+BUFF:GTJDS"], type: string }
        - { name: full_protocol_version, type: hex, length: 10, example: "80200C0300" }
        - { name: unique_id, type: string, length: 15, pattern: "^[0-9]{15}$", example: "135790246811220" }
        - { name: device_name, type: string, max_length: 20, pattern: "^[0-9A-Za-z_-]{1,20}$", example: "GV75LAU" }

    - name: body
      fields:
        # --- Cabecera JDS ---
        - name: jamming_status
          type: int
          enum: [1,2]
          description: "1=Quit the jamming state, 2=Enter the jamming state"
        - name: jamming_net
          type: int
          min: 1
          max: 5
          description: "Network mode: 1=EGPRS/GSM,2=LTE-Cat4,3=WCDMA+EGPRS/GSM+LTE,4=WCDMA,5=WCDMA+EGPRS"
        - { name: gnss_accuracy_level, type: int, min: 0, max: 50 }
        - { name: speed_kmh, type: float, min: 0.0, max: 999.9 }
        - { name: azimuth_deg, type: int, min: 0, max: 359 }
        - { name: altitude_m, type: float }
        - { name: longitude_deg, type: float }
        - { name: latitude_deg, type: float }
        - { name: gnss_utc_time, type: datetime, format: "YYYYMMDDHHMMSS" }

        # --- Celular / Celdas ---
        - { name: mcc, type: string, pattern: "^0[0-9]{3}$", nullable: true }
        - { name: mnc, type: string, pattern: "^0[0-9]{2,3}$", nullable: true }
        - { name: lac_hex, type: hex, length: 4, nullable: true }
        - { name: cell_id_hex, type: hex, length_variant: [4,8], nullable: true }

        # --- Append Mask de posición ---
        - { name: position_append_mask, type: hex, length: 2, description: "00-FF (bitwise for optional position fields)" }
        - { name: satellites_in_use, type: int, min: 0, max: 72, optional: true, when: { mask: position_append_mask, bit: 0 } }
        - name: device_status
          type: hex
          length_variant: [6,10]
          description: "Optional device status expansion (present if INF/Report mask requests it)"
          optional: true

    - name: tail
      fields:
        - { name: send_time, type: datetime, format: "YYYYMMDDHHMMSS" }
        - { name: count_number, type: hex, length: 4, description: "0000-FFFF (contador, no es CRC)" }
        - { name: tail, const: "$", type: string, optional: true, default_if_absent: "$" }

# --------- Derivaciones ---------
derivations:
  - name: lac
    from: lac_hex
    type: int
    transform: "hex_to_uint"
  - name: cell_id
    from: cell_id_hex
    type: int
    transform: "hex_to_uint"
  - name: gnss_chile_time
    from: gnss_utc_time
    type: datetime
    transform: "to_timezone"
    args: { tz: "America/Santiago" }
  - name: send_chile_time
    from: send_time
    type: datetime
    transform: "to_timezone"
    args: { tz: "America/Santiago" }

# --------- Validaciones ---------
validations:
  - rule: "device_name == 'GV75LAU'"
    message: "El modelo no corresponde a GV75LAU."
  - rule: "jamming_status in [1,2]"
    message: "Jamming Status debe ser 1 o 2."
  - rule: "gnss_accuracy_level >= 0 and gnss_accuracy_level <= 50"
    message: "GNSS accuracy fuera de rango."
  - rule: "count_number matches '^[0-9A-Fa-f]{4}$'"
    message: "Count Number debe ser 4 hex."

# --------- Ejemplos ---------
examples:
  - raw: "+RESP:GTJDS,80200C0300,135790246811220,GV75LAU,1,3,0,4.3,92,70.0,121.354335,31.222073,20230214013254,0460,0000,18d8,6141,05,1,220100,20230214093254,11F0$"
  - raw: "+BUFF:GTJDS,80200C0300,135790246811220,GV75LAU,2,3,0,0.0,0,0.0,-, -,20230214013254,,,,,00,20230214013254,11F1$"
