name: "+RESP/+BUFF:GTFRI"
device: "GV350CEU"
message_family: "FRI (Fixed Report Information)"
encoding: "ASCII"
delimiter: ","
terminator: "$"

config:
  append_mask:
    field: position_append_mask
    length: 2
    default: "00"
    bits:
      0: { name: satellites_in_use,            desc: "0-72" }
      1: { name: horizontal_gnss_accuracy,     desc: "0.00-99.99" }
      2: { name: vertical_gnss_accuracy,       desc: "0.00-99.99" }
      3: { name: gnss_3d_accuracy,             desc: "0.00-99.99" }

schema:
  sections:
    - name: head
      fields:
        - { name: header, const_any: ["+RESP:GTFRI", "+BUFF:GTFRI"], type: string }
        - { name: full_protocol_version, type: hex, length: 6, example: "740904" }
        - { name: unique_id, type: string, length: 15, pattern: "^[0-9]{15}$", example: "862524060867948" }
        - { name: device_name, type: string, max_length: 20, pattern: "^[0-9A-Za-z_-]{1,20}$", example: "GV350CEU" }

    - name: body
      fields:
        # --- Core ERI / Cabecera del reporte ---
        - { name: external_power_mv, type: int, min: 0, max: 32000, nullable: true, description: "External Power Voltage (mV)" }
        - { name: report_id_type, type: string, pattern: "^[0-5][0-6]$", example: "10", description: "Report ID / Report Type: X(0-5)Y(0-6)" }
        - { name: number, type: int, min: 1, max: 15, nullable: true, description: "Number (<=2 digits)" }

        # --- GNSS / Movimiento ---
        - { name: gnss_accuracy_level, type: int, min: 0, max: 50 }
        - { name: speed_kmh, type: float, min: 0.0, max: 999.9 }
        - { name: azimuth_deg, type: int, min: 0, max: 359 }
        - { name: altitude_m, type: float }
        - { name: longitude_deg, type: float }
        - { name: latitude_deg, type: float }
        - { name: gnss_utc_time, type: datetime, format: "YYYYMMDDHHMMSS" }

        # --- Red celular ---
        - { name: mcc, type: string, pattern: "^0[0-9]{3}$" }
        - { name: mnc, type: string, pattern: "^0[0-9]{2,3}$" }
        - { name: lac_hex, type: hex, length: 4 }
        - { name: cell_id_hex, type: hex, length_variant: [4,8] }

        # --- Append Mask de posición (estilo GV58LAU) ---
        - { name: position_append_mask, type: hex, length: 2, description: "00-FF (Bit0=Sats, Bit1=H-Acc, Bit2=V-Acc, Bit3=3D-Acc)" }
        - { name: satellites_in_use, type: int, min: 0, max: 72, optional: true, when: { mask: position_append_mask, bit: 0 } }
        -
          name: horizontal_gnss_accuracy
          type: float
          min: 0.00
          max: 99.99
          optional: true
          when:
            any_of:
              - { mask: position_append_mask, bit: 1 }
              - { mask: position_append_mask, bit: 3 }
        -
          name: vertical_gnss_accuracy
          type: float
          min: 0.00
          max: 99.99
          optional: true
          when:
            any_of:
              - { mask: position_append_mask, bit: 2 }
              - { mask: position_append_mask, bit: 3 }
        - { name: gnss_3d_accuracy, type: float, min: 0.00, max: 99.99, optional: true, when: { mask: position_append_mask, bit: 3 } }

        # --- Acumulados / IO ---
        - { name: mileage_km, type: float, min: 0.0, max: 4294967.0 }
        - { name: hour_meter, type: string, pattern: "^[0-9]{7}:[0-5][0-9]:[0-5][0-9]$", example: "0000000:00:00" }
        - { name: analog_in_1, type: string, max_length: 5, optional: true, description: "0-16000(mV)|F(0-100)" }
        - { name: analog_in_2, type: string, max_length: 5, optional: true, description: "0-16000(mV)|F(0-100)" }
        - { name: analog_in_3, type: string, max_length: 5, optional: true, description: "0-16000(mV)|F(0-100)" }
        - { name: backup_battery_percentage, type: int, min: 0, max: 100, optional: true }
        - { name: device_status, type: hex, length_variant: [6,10] }
        - { name: reserved1, type: string, optional: true }
        - { name: reserved2, type: string, optional: true }
        - { name: reserved3, type: string, optional: true }

    - name: tail
      fields:
        - { name: send_time, type: datetime, format: "YYYYMMDDHHMMSS" }
        - { name: count_number, type: hex, length: 4, description: "0000-FFFF (no es CRC)" }
        - { name: tail, const: "$", type: string, optional: true, default_if_absent: "$" }

# --------- Derivaciones útiles ---------
derivations:
  - name: lac
    from: lac_hex
    type: int
    transform: "hex_to_uint"
  - name: cell_id
    from: cell_id_hex
    type: int
    transform: "hex_to_uint"
  - name: gnss_chile_time
    from: gnss_utc_time
    type: datetime
    transform: "to_timezone"
    args: { tz: "America/Santiago" }
  - name: send_chile_time
    from: send_time
    type: datetime
    transform: "to_timezone"
    args: { tz: "America/Santiago" }

# --------- Validaciones ---------
validations:
  - rule: "device_name == 'GV350CEU'"
    message: "El modelo no corresponde a GV350CEU."
  - rule: "gnss_accuracy_level >= 0 and gnss_accuracy_level <= 50"
    message: "GNSS accuracy fuera de rango."
  - rule: "backup_battery_percentage == null or (backup_battery_percentage >= 0 and backup_battery_percentage <= 100)"
    message: "Backup Battery % fuera de rango."
  - rule: "count_number matches '^[0-9A-Fa-f]{4}$'"
    message: "Count Number debe ser 4 hex."

# --------- Ejemplos reales (GV350CEU) ---------
examples:
  - raw: "+RESP:GTFRI,740904,862524060867948,GV350CEU,,10,1,1,89.5,169,672.9,-70.292914,-23.949947,20251016184033,0730,0001,0836,002BEE06,01,12,775824.1,0000439:30:29,,,,100,221102,,,,20251016184035,AA3C$"
    expect:
      position_append_mask: "01"
      satellites_in_use: 12
      backup_battery_percentage: 100
  - raw: "+BUFF:GTFRI,740904,862524060867948,GV350CEU,,10,1,1,89.6,168,690.2,-70.291068,-23.958760,20251016184113,0730,0001,0836,002BEE06,01,12,775825.1,0000439:31:11,,,,100,221102,,,,20251016184115,AA41$"
    expect:
      position_append_mask: "01"
      satellites_in_use: 12
      send_chile_time: "2025-10-16 15:41:15-03"
